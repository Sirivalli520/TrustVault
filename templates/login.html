{% extends "base.html" %}{% block title %}Log in — TrustVault{% endblock %}
{% block content %}<section class="panel" style="max-width:520px;margin:40px auto"><h1>Log in</h1><form method="post">
<label>Username</label><input name="username" autocomplete="username" required maxlength="32">
<label>Password</label><input name="password" type="password" autocomplete="current-password" required>
<p><button>Log in</button></p></form><p class="muted">New here? <a href="{{ url_for('register') }}">Create an account</a>.</p></section>{% endblock %}
