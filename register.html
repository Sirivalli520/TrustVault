{% extends "base.html" %}{% block title %}Create account — TrustVault{% endblock %}
{% block content %}<section class="panel" style="max-width:560px;margin:40px auto"><h1>Create account</h1>
<p class="muted">Public signup can create owners or viewers only. Administrator accounts must be provisioned through environment variables.</p>
<form method="post"><label>Username</label><input name="username" required minlength="3" maxlength="32" pattern="[A-Za-z0-9_.-]+">
<label>Password (10+ characters)</label><input name="password" type="password" required minlength="10" autocomplete="new-password">
<label>Role</label><select name="role"><option value="owner">Document owner</option><option value="viewer">Viewer</option></select>
<p><button>Create account</button></p></form></section>{% endblock %}
